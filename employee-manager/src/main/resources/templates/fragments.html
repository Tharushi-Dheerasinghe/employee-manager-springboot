<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Form fields shared by the "Add" page and the "Edit" page -->
<div th:fragment="fields">
 <div class="field">
 <label for="fullName">Full Name</label>
 <input type="text" id="fullName" th:field="*{fullName}" placeholder="e.g. Nimal Perera">
 <small class="error" th:if="${#fields.hasErrors('fullName')}"
th:errors="*{fullName}"></small>
 </div>
 <div class="field">
 <label for="email">Email</label>
 <input type="email" id="email" th:field="*{email}" placeholder="nimal@example.com">
 <small class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></small>
 </div>
 
 <div class="field">
 <label for="phone">Phone (10 digits)</label>
 <input type="text" id="phone" th:field="*{phone}" placeholder="0771234567">
 <small class="error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></small>
 </div>
 <div class="field">
 <label for="age">Age</label>
 <input type="number" id="age" th:field="*{age}" placeholder="21">
 <small class="error" th:if="${#fields.hasErrors('age')}" th:errors="*{age}"></small>
 </div>
 <div class="field">
    <label for="department">Department</label>
    <input type="text" id="department" th:field="*{department}" placeholder="e.g. IT">
    <small class="error" th:if="${#fields.hasErrors('department')}" th:errors="*{department}"></small>
</div>

<div class="field">
    <label for="salary">Salary</label>
    <input type="number" id="salary" th:field="*{salary}" placeholder="e.g. 75000" step="0.01">
    <small class="error" th:if="${#fields.hasErrors('salary')}" th:errors="*{salary}"></small>
</div>
</div>
</body>
</html>
